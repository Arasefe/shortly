# shortly's web server (alpine nginx reads /etc/nginx/http.d/*.conf inside http{}).
# nginx terminates TLS on 443 and proxies to the app on the container's loopback.
# Built up one concern at a time in the slides; this is the final, hardened result.

limit_req_zone $binary_remote_addr zone=admin:10m rate=5r/m;

# compression (a non-security win): compress text on the way out
gzip            on;
gzip_proxied    any;
gzip_min_length 256;
gzip_types      text/plain text/css application/javascript application/json image/svg+xml;

# the app, in this same container
upstream shortly_app { server 127.0.0.1:3000; }

server {
    listen 443 ssl;
    http2 on;

    # TLS: self-signed in the lab (generated at startup), a real CA in production
    ssl_certificate     /etc/nginx/certs/shortly.crt;
    ssl_certificate_key /etc/nginx/certs/shortly.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # limits: one slow or oversized client can't tie the server up (Slowloris, upload DoS)
    client_header_timeout 5s;    # finish sending headers within 5s
    client_body_timeout   5s;    # finish sending the body within 5s
    send_timeout          5s;    # keep reading our response, too
    keepalive_timeout     15s;   # idle keep-alives don't linger
    client_max_body_size  1m;    # a giant "upload" is refused with 413, not buffered

    # security headers, set once for every response
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options    "nosniff"          always;
    add_header X-Frame-Options           "DENY"             always;
    add_header Referrer-Policy           "no-referrer"      always;
    # added after the DAST (ZAP) pass flagged them missing:
    add_header Content-Security-Policy   "default-src 'self'; frame-ancestors 'none'; base-uri 'self'" always;
    add_header Permissions-Policy        "geolocation=(), microphone=(), camera=()" always;
    server_tokens off;
    limit_req_status 429;   # rate-limited requests get 429, not nginx's default 503

    # static assets: let the browser cache them hard (a non-security win)
    location ~* \.(?:css|js|svg|png|ico|woff2)$ {
        proxy_pass http://shortly_app;
        proxy_set_header Host $host;
        expires 7d;                      # -> Cache-Control: max-age=604800
    }

    # the admin endpoint: rate-limited (you could also IP-allowlist it)
    location /api/admin/ {
        limit_req zone=admin burst=3 nodelay;
        proxy_pass http://shortly_app;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # everything else
    location / {
        proxy_pass http://shortly_app;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
